name: Build iOS (Unsigned for TrollStore)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用包含 Dart 3.7+ 的 Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'   # 或 'stable'，但建议固定版本
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # === 关键修复：创建 .env 文件，防止资源缺失 ===
      - name: Create .env file
        run: |
          # 如果项目依赖具体变量，可从 Secrets 注入，例如：
          # echo "TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}" > .env
          # 否则直接创建空文件即可
          touch .env

      # CocoaPods 环境
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # 构建未签名的 .app
      - name: Build unsigned .app
        run: |
          flutter build ios --release --no-codesign

      # 手动打包成 .ipa（无签名，适用于 TrollStore）
      - name: Package unsigned .ipa
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r -9 tmdb-unsigned.ipa Payload

      # 上传产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-unsigned-ipa
          path: tmdb-unsigned.ipa
          retention-days: 7
