name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 允许手动触发

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      # 1. 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 设置 Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4' # 根据 SDK 约束 ^3.7.0，使用最新的稳定版，建议调整
          channel: 'stable'
          cache: true

      # 3. 安装项目依赖
      - name: Install dependencies
        run: flutter pub get

      # 4. 生成代码（json_serializable, drift, retrofit 等需要 build_runner）
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 5. 设置 Ruby 环境并安装 CocoaPods
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      # 6. 安装 iOS 项目 Pods
      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # 7. 设置代码签名（需预先配置证书和描述文件）
      # 推荐使用 fastlane match 或手动导入证书，这里用 Apple 官方方式示例
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
        run: |
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Warning: No provisioning profile provided. Skipping install."
            exit 0
          fi
          echo $PROVISIONING_PROFILE_BASE64 | base64 --decode > $PROVISIONING_PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          # 获取 UUID
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PROVISIONING_PROFILE_PATH))
          mv ~/Library/MobileDevice/Provisioning\ Profiles/$PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

      - name: Install certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Warning: No certificate provided. Skipping install."
            exit 0
          fi
          # 创建临时钥匙串
          security create-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH

          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" $KEYCHAIN_PATH

      # 8. 构建 iOS App（使用 xcodebuild 或 flutter build ios）
      - name: Build iOS App (Release)
        run: |
          flutter build ios --release --no-codesign # 若需要签名，去掉 --no-codesign，并设置 export 选项
        env:
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}
          FLUTTER_BUILD_NAME: 7.6.5

      # 9. 导出 IPA（若需要分发，可集成 fastlane）
      # 简单的导出方式：使用 xcodebuild -exportArchive
      - name: Archive and Export IPA
        run: |
          # 使用 Flutter 生成的 Runner.xcarchive
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -archivePath build/Runner.xcarchive archive
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportPath build/ -exportOptionsPlist ExportOptions.plist
        env:
          DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          PROVISIONING_PROFILE_SPECIFIER: ${{ secrets.IOS_PROVISIONING_PROFILE_SPECIFIER }}
        # 需要提前创建 ExportOptions.plist 或在仓库中提供，这里作为示例

      # 10. 上传 IPA 作为构建产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/Runner.ipa
          retention-days: 7
