name: Build iOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 使用包含 Dart 3.7+ 的 Flutter 版本
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'   # 或 '3.30.0' / 'stable'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 运行代码生成器
      - name: Run build_runner
        run: flutter pub run build_runner build --delete-conflicting-outputs

      # 设置 Ruby 和 CocoaPods
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install Pods
        run: |
          cd ios
          pod install
          cd ..

      # 证书和描述文件导入（需提前配置 Secrets）
      - name: Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          PROVISIONING_PROFILE_PATH: ${{ runner.temp }}/profile.mobileprovision
        run: |
          if [ -z "$PROVISIONING_PROFILE_BASE64" ]; then
            echo "Warning: No provisioning profile provided. Skipping install."
            exit 0
          fi
          echo $PROVISIONING_PROFILE_BASE64 | base64 --decode > $PROVISIONING_PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PROVISIONING_PROFILE_PATH))
          mv ~/Library/MobileDevice/Provisioning\ Profiles/$PROVISIONING_PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

      - name: Install certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PATH: ${{ runner.temp }}/build.keychain
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "Warning: No certificate provided. Skipping install."
            exit 0
          fi
          security create-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$P12_PASSWORD" $KEYCHAIN_PATH
          echo $BUILD_CERTIFICATE_BASE64 | base64 --decode > ${{ runner.temp }}/cert.p12
          security import ${{ runner.temp }}/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$P12_PASSWORD" $KEYCHAIN_PATH

      # 构建并导出 IPA（使用 flutter build ipa 更简洁）
      - name: Build and export IPA
        run: |
          flutter build ipa \
            --release \
            --export-options-plist ios/ExportOptions.plist
        env:
          FLUTTER_BUILD_NUMBER: ${{ github.run_number }}
          FLUTTER_BUILD_NAME: 7.6.5
          # 签名所需的环境变量由 Flutter 从 xcode 项目中读取，通常需在 ExportOptions.plist 中指定
          # 如需手动指定团队，可添加：--dart-define=DEVELOPMENT_TEAM=...

      # 上传 IPA 产物
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
